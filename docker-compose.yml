version: '3.8'

# ==============================================================================
# NeuroLab AI: Docker Compose Configuration
# Problem 32 & 33: Explicit Configuration Contract, Hardened Persistence & Lifecycle
# ==============================================================================

x-service-config-contract: &service-config-contract
  description: "Canonical configuration contract for NeuroLab AI backend and worker services"
  environment:
    - ENVIRONMENT=${ENVIRONMENT:-development}
    - IS_CONTAINER=true
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - SUPABASE_URL=${SUPABASE_URL}
    - SUPABASE_KEY=${SUPABASE_KEY}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stemlab_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-stemlab}
    expose:
      - "5432"
    volumes:
      # Problem 33: Durable named volume persistence replacing ephemeral bind mounts
      - pgdata:/var/lib/postgresql/data
      - db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stemlab_app} -d ${POSTGRES_DB:-stemlab}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - neurolab_net

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.core_backend.database.migrations"]
    environment:
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - neurolab_net
    restart: "no"

  backend:
    image: ai-stem-lab-assistant-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend/app/database:/app/app/database
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - neurolab_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - neurolab_net

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - neurolab_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - neurolab_net

  db_backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.core_backend.database.backup", "create", "--dir", "/backups"]
    environment:
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - neurolab_net
    profiles:
      - backup
    restart: "no"

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - neurolab_net

volumes:
  pgdata:
    driver: local
  db_backups:
    driver: local

networks:
  neurolab_net:
    driver: bridge
