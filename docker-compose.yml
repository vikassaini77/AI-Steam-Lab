version: '3.8'

# ==============================================================================
# NeuroLab AI: Docker Compose Configuration
# Problem 32: Explicit Configuration Contract for Services
# ==============================================================================

x-service-config-contract: &service-config-contract
  description: "Canonical configuration contract for NeuroLab AI backend and worker services"
  environment:
    - ENVIRONMENT=${ENVIRONMENT:-development}
    - IS_CONTAINER=true
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - SUPABASE_URL=${SUPABASE_URL}
    - SUPABASE_KEY=${SUPABASE_KEY}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports removed to prevent direct host access bypassing the proxy
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend/app/database:/app/app/database
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Ports removed to prevent direct host access
    expose:
      - "8080"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stemlab_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-stemlab}
    expose:
      - "5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stemlab_app} -d ${POSTGRES_DB:-stemlab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env (e.g. postgresql://${POSTGRES_USER:-stemlab_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stemlab})}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - IS_CONTAINER=true
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
