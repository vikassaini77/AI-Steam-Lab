# ==============================================================================
# NeuroLab AI: Edge & Gateway Nginx Reverse Proxy Configuration
# Problem 36: Explicit streaming, payload policies, timeouts, and WebSocket isolation
# ==============================================================================

upstream backend_service {
    server backend:8000;
    keepalive 32;
}

upstream frontend_service {
    server frontend:8080;
    keepalive 32;
}

# Map client Upgrade header to Connection header for safe WebSocket negotiation
# Avoids forwarding Connection: upgrade indiscriminately to standard HTTP routes
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    # 1. Payload & Request Body Size Limits
    # Accommodates valid video frames (5MB binary / 7MB base64) while preventing memory exhaustion
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 2. Client Socket Timeouts
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # 3. Dedicated Long-Running AI SSE Streaming Endpoints
    # Explicitly disables response buffering so tokens stream immediately without stalling
    location ~ ^/api/(v1/)?tutor/chat/stream {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable all proxy buffering and caching for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeouts for long-running LLM generation (exceeds normal request timeout)
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 4. General Backend REST API Endpoints
    # Standard buffering enabled for normal API responses to maximize throughput and backend efficiency
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Standard proxy buffering for ordinary API responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Standard API timeouts: terminates hung connections promptly
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. Backend Readiness and Liveness Health Probes
    location ~ ^/(ready|live|healthz) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 6. Dedicated WebSocket Route (isolated from static / REST routes)
    location /ws/ {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 7. Frontend Single-Page Application (Standard HTTP)
    # Does NOT forward WebSocket upgrade headers indiscriminately to regular routes
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for static assets
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
