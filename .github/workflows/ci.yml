name: NeuroLab CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        pip install -r requirements.txt
        
    - name: Lint with Ruff
      working-directory: ./backend
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --show-source
        # exit-zero treats all errors as warnings
        ruff check . --exit-zero
        
    - name: Test with pytest
      working-directory: ./backend
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      run: |
        # Only run if tests exist, else skip gracefully
        if [ -d "tests" ]; then pytest tests/; else echo "No tests folder found, skipping."; fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Use Node.js 20
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: "20"
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci || npm install
      
    - name: TypeScript Linting
      working-directory: ./frontend
      run: npm run lint --if-present
      
    - name: Build React App
      working-directory: ./frontend
      run: npm run build
      
  docker-security-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Python for policy validation
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"

    - name: Validate Trivy suppression policy and expiration
      run: python .github/scripts/validate_trivy_policy.py --ignorefile .trivyignore

    - name: Build Backend Docker Image for Scanning
      run: docker build -t ai-stem-lab-assistant-backend:latest ./backend
      
    - name: Generate Machine-Readable Trivy Scan Results (SARIF)
      uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
      with:
        image-ref: 'ai-stem-lab-assistant-backend:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        vuln-type: 'os,library'
        trivyignores: '.trivyignore'

    - name: Retain Machine-Readable Scan Results (Artifact Retention)
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: trivy-security-results
        path: trivy-results.sarif
        retention-days: 30

    - name: Upload Scan Results to GitHub Security Tab (Code Scanning)
      uses: github/codeql-action/upload-sarif@df80e922e9a4a530e2c884e18d89786fac6005b1 # v3.28.10
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Scan Backend Docker Image (Block on Critical/High Vulnerabilities)
      uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
      with:
        image-ref: 'ai-stem-lab-assistant-backend:latest'
        format: 'table'
        exit-code: '1' # Problem 37: Block releases when unsuppressed critical/high vulnerabilities exist
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'
