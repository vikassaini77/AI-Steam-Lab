name: NeuroLab CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_stemlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Python 3.11
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"
        
    - name: Install dependencies with locked versions
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov httpx
        pip install --no-cache-dir -r requirements.txt
        
    - name: Enforce critical Ruff rules (Blocking)
      working-directory: ./backend
      run: |
        # Problem 39: Enforce critical syntax, bugbear, and correctness rules
        ruff check . --select=E9,F821,F822,F823,F63,F7,E711,E712,E713,E714,E721,E722,B006,B007,B009,B010

    - name: Informational lint report (Non-blocking)
      working-directory: ./backend
      continue-on-error: true
      run: |
        # Separate informational linting report from blocking quality gate
        ruff check . --output-format=github

    - name: Verify mandatory test suite presence
      working-directory: ./backend
      run: |
        # Problem 38: Fail CI if mandatory unit, integration, or API authorization test suites are missing
        python -m app.core_backend.core.test_suite_verifier --verify-all
        
    - name: Run mandatory backend tests with coverage
      working-directory: ./backend
      env:
        # Problem 38: Run hermetically with isolated service containers and non-production credentials
        ENVIRONMENT: test
        TESTING: "true"
        GEMINI_API_KEY: test-mock-gemini-key
        SUPABASE_URL: https://mock-supabase.test
        SUPABASE_KEY: test-mock-supabase-key
        SUPABASE_JWT_SECRET: test-mock-jwt-secret-at-least-32-chars-long
        POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/test_stemlab
        REDIS_URL: redis://localhost:6379/0
        METRICS_TOKEN: test-mock-metrics-token
        ALLOW_FAKE_VECTORS: "true"
        DISABLE_SENTRY: "true"
      run: |
        # Problem 38: Enforce mandatory execution and generate coverage report
        pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

    - name: Upload backend test coverage report
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: backend-test-coverage
        path: backend/coverage.xml
        retention-days: 30

  frontend-build:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Use Node.js 20
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: "20"
        
    - name: Install dependencies with locked versions
      working-directory: ./frontend
      run: |
        # Problem 40: Use npm ci with committed package-lock.json for reproducible installs
        npm ci
      
    - name: TypeScript Type Checking (Blocking)
      working-directory: ./frontend
      run: |
        # Problem 39: Run TypeScript typecheck to enforce compile-time soundness
        npm run typecheck
      
    - name: Frontend ESLint (Blocking)
      working-directory: ./frontend
      run: |
        # Problem 39: Run frontend linter without suppressing its exit status
        npm run lint
      
    - name: Build React App (Reproducible)
      working-directory: ./frontend
      run: npm run build

  compose-deployment-integration:
    name: Full Compose Deployment End-to-End Test (Problem 41)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python 3.11
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"

    - name: Install integration test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx requests numpy opencv-python-headless pyjwt websockets pydantic

    - name: Configure test environment contract (.env)
      run: |
        cat << 'EOF' > .env
        POSTGRES_USER=stemlab_app
        POSTGRES_PASSWORD=stemlab_secure_password_2026
        POSTGRES_DB=stemlab
        POSTGRES_URL=postgresql://stemlab_app:stemlab_secure_password_2026@db:5432/stemlab
        REDIS_URL=redis://redis:6379/0
        GEMINI_API_KEY=test-mock-gemini-key
        SUPABASE_URL=https://mock-supabase.test
        SUPABASE_KEY=test-mock-supabase-key
        SUPABASE_JWT_SECRET=test-mock-jwt-secret-at-least-32-chars-long
        METRICS_TOKEN=test-mock-metrics-token
        ENVIRONMENT=production
        ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
        EOF

    - name: 1. Build frontend and backend images
      run: docker compose build

    - name: 2. Start PostgreSQL and Redis
      run: |
        docker compose up -d db redis
        timeout 30s bash -c 'until docker compose ps db | grep -q "(healthy)"; do sleep 2; done' || true

    - name: 3. Apply database migrations
      run: docker compose run --rm migration

    - name: 4. Start API, worker, frontend, and proxy
      run: docker compose up -d backend celery_worker frontend proxy

    - name: 5. Check stack readiness through proxy
      run: python backend/scripts/wait_for_stack_readiness.py --url http://localhost:8080/ready --timeout 60

    - name: 6. Run end-to-end integration test suite
      env:
        PYTHONPATH: backend
        POSTGRES_URL: postgresql://stemlab_app:stemlab_secure_password_2026@localhost:5432/stemlab
      run: pytest backend/tests/test_e2e_compose_deployment.py -v

    - name: 7a. Dump container logs on completion
      if: always()
      run: docker compose logs > compose-deployment-logs.txt

    - name: 7b. Upload Compose logs artifact
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: compose-deployment-logs
        path: compose-deployment-logs.txt
        retention-days: 14

    - name: 7c. Shut down Compose stack
      if: always()
      run: docker compose down -v
      
  docker-security-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Python for policy validation
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.11"

    - name: Validate Trivy suppression policy and expiration
      run: python .github/scripts/validate_trivy_policy.py --ignorefile .trivyignore

    - name: Build Backend Docker Image for Scanning
      run: docker build -t ai-stem-lab-assistant-backend:latest ./backend
      
    - name: Generate Machine-Readable Trivy Scan Results (SARIF)
      uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
      with:
        image-ref: 'ai-stem-lab-assistant-backend:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        vuln-type: 'os,library'
        trivyignores: '.trivyignore'

    - name: Retain Machine-Readable Scan Results (Artifact Retention)
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: trivy-security-results
        path: trivy-results.sarif
        retention-days: 30

    - name: Upload Scan Results to GitHub Security Tab (Code Scanning)
      uses: github/codeql-action/upload-sarif@df80e922e9a4a530e2c884e18d89786fac6005b1 # v3.28.10
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Scan Backend Docker Image (Block on Critical/High Vulnerabilities)
      uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
      with:
        image-ref: 'ai-stem-lab-assistant-backend:latest'
        format: 'table'
        exit-code: '1' # Problem 37: Block releases when unsuppressed critical/high vulnerabilities exist
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'
