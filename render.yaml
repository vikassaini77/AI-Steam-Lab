services:
  - type: web
    name: stemlab-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    repo: https://github.com/vikassaini77/AI-Steam-Lab
    branch: main
    plan: free
    healthCheckPath: /ready
    preDeployCommand: python -m app.core_backend.database.migrations
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: IS_CONTAINER
        value: "true"
      - key: PORT
        value: "8000"
      - key: ENABLE_YOLO
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: stemlab-redis
          envVarKey: REDIS_URL
      - key: POSTGRES_URL
        fromDatabase:
          name: stemlab-db
          envVarKey: DATABASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: stemlab-db
          envVarKey: DATABASE_URL

  - type: worker
    name: stemlab-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    repo: https://github.com/vikassaini77/AI-Steam-Lab
    branch: main
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: IS_CONTAINER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: stemlab-redis
          envVarKey: REDIS_URL
      - key: POSTGRES_URL
        fromDatabase:
          name: stemlab-db
          envVarKey: DATABASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: stemlab-db
          envVarKey: DATABASE_URL

  - type: redis
    name: stemlab-redis
    plan: free
    ipAllowList: []

databases:
  - name: stemlab-db
    databaseName: stemlab
    user: neurolab_app
    plan: free
    postgresMajorVersion: 16
    ipAllowList: []
