# ==============================================================================
# NeuroLab AI: Production Nginx Reverse Proxy Configuration
# Satisfies Problem 7: Request size, timeouts, streaming buffering & metrics access
# ==============================================================================

upstream neurolab_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.neurolab.ai;

    # Enforce HTTPS redirect at the edge
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.neurolab.ai;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/api.neurolab.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.neurolab.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Edge HSTS: Enabled strictly for production HTTPS domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 1. Request Size Limits (Prevents memory exhaustion / payload flooding)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 2. Timeouts: Adequate for LLM SSE generation while terminating hung sockets
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # 3. Restrict Prometheus Metrics to Internal Monitoring Subnets / Scrapers
    location /metrics {
        # Allow VPC / Prometheus monitoring server IPs
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        
        # Deny external untrusted public traffic
        # Note: Authorized monitoring scrapers can also authenticate via Bearer token
        proxy_pass http://neurolab_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Long-running AI SSE Streaming Endpoint
    location /api/tutor/chat/stream {
        proxy_pass http://neurolab_backend/api/tutor/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all proxy buffering and caching for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeouts compatible with long-running LLM streams
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 5. Main API Reverse Proxy & General Endpoints
    location / {
        proxy_pass http://neurolab_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CRITICAL FOR SSE STREAMING (/api/tutor/chat/stream):
        # Disable buffering so streaming tokens are immediately transmitted to the client
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}

